# 出可上机的包：iOS（macOS runner，未签名 IPA，自签）+ Android（ubuntu runner，APK）。
#
# 为什么走 CI：产出 iOS 包必须有 macOS + Xcode，Windows 做不到。这里用 GitHub 免费额度
# 里的 macOS runner（公开仓库免费；私有仓库按 macOS 倍率扣分钟）。
#
# 前置（都很关键）：
#   1. 本文件必须在**默认分支**（main）上，workflow_dispatch 才会在 Actions 页出现。
#      push 触发则不受此限（本文件已配 push，推任意分支都会跑）。
#   2. 仓库 Settings → Actions → General 里允许运行工作流。
#
# 产物：
#   - artifact `PiliPlus-ios-unsigned` → PiliPlus.ipa（未签名，自己签：AltStore /
#     SideStore / Sideloadly / TrollStore 都能吃；免费 Apple ID 的 provisioning
#     7 天过期，SideStore 可自动续期。上游 CI 特意对 Frameworks 做 ad-hoc codesign，
#     那一步就是为 AltStore 准备的，这里保留）。
#   - artifact `PiliPlus-android` → 按 ABI 拆分的 APK。

name: Build packages

on:
  workflow_dispatch:
    inputs:
      run_tests:
        description: '先跑 CDN 相关单测'
        type: boolean
        default: true
      flutter_version:
        description: 'Flutter 版本（默认 3.47.5，与本机一致）'
        type: string
        default: '3.47.5'
      build_ios:
        description: '构建 iOS（macOS runner）'
        type: boolean
        default: true
      build_android:
        description: '构建 Android APK'
        type: boolean
        default: true
      make_release:
        description: '构建成功后发一个 beta 预发布'
        type: boolean
        default: true
  push:
    # 推分支即构建，省得先合进 main 才能试——CI 的第一次跑通常要迭代几轮
    branches:
      - main
      - 'feat/**'
      - 'fix/**'
    paths-ignore:
      - '**.md'
      - 'docs/**'

jobs:
  ios:
    name: iOS (unsigned IPA)
    if: ${{ github.event_name == 'push' || inputs.build_ios }}
    runs-on: macos-26
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # build.ps1 用 git rev-list --count HEAD 算 versionCode，需要完整历史
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ inputs.flutter_version || '3.47.5' }}
          cache: true

      - name: Prepare (版本约束 / 依赖 / patch)
        shell: pwsh
        run: tool/ci_prepare.ps1 iOS

      - name: Run CDN unit tests
        if: ${{ github.event_name == 'push' || inputs.run_tests }}
        run: flutter test test/services/cdn/

      - name: Build IPA
        run: |
          set -euo pipefail
          flutter build ios --release --no-codesign \
            --dart-define-from-file=pili_release.json --no-pub

          APP=build/ios/iphoneos/Runner.app
          test -d "$APP" || { echo "没有 $APP"; exit 1; }

          # 1) 全量 ad-hoc 签名。
          #    上游只签 Frameworks，主 app 保持未签名——那是个不一致状态：PC 端签名
          #    工具（全能签 / Lsing 之类）解析时可能判为异常。这里连主 app 一起签。
          #    顺序：先内层后外层。
          find "$APP/Frameworks" -type d -name "*.framework" -maxdepth 1 -print0 \
            | xargs -0 -n1 -I{} codesign --force --sign - --timestamp=none {} || true
          find "$APP" -type f \( -name "*.dylib" -o -perm -u+x \) -maxdepth 3 -print0 \
            | xargs -0 -n1 -I{} codesign --force --sign - --timestamp=none {} 2>/dev/null || true
          codesign --force --sign - --timestamp=none "$APP"

          # 2) 自检：签名与结构（失败即让构建红掉，别产出可疑包）
          codesign -dv "$APP" 2>&1 | head -5
          codesign --verify --deep --strict --verbose=2 "$APP" || true

          # 3) 用 Apple 自己的方式打 IPA。
          #    `ditto -c -k --sequesterRsrc --keepParent` 是 Xcode 导出 IPA 用的命令；
          #    比 `zip` 更完整地保留 Unix 权限位与扩展属性——权限位丢了是最常见的
          #    "装不上"原因。
          rm -rf Payload PiliPlus.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/Runner.app
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent Payload PiliPlus.ipa

          # 4) 存档自检
          ls -lh PiliPlus.ipa
          unzip -l PiliPlus.ipa | head -12
          echo "--- 关键条目 ---"
          unzip -l PiliPlus.ipa | grep -E "Payload/Runner.app/(Runner|Info.plist|_CodeSignature/CodeResources)$" || true
          echo "--- Runner 权限（应为 rwxr-xr-x）---"
          unzip -Z PiliPlus.ipa | grep -E "Runner$" | head -3 || true

      - name: Upload IPA
        uses: actions/upload-artifact@v7
        with:
          name: PiliPlus-ios-unsigned
          path: PiliPlus.ipa
          if-no-files-found: error

  android:
    name: Android (APK)
    if: ${{ github.event_name == 'push' || inputs.build_android }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ inputs.flutter_version || '3.47.5' }}
          cache: true

      - name: Prepare (版本约束 / 依赖 / patch)
        shell: pwsh
        run: tool/ci_prepare.ps1 android

      - name: Run CDN unit tests
        if: ${{ github.event_name == 'push' || inputs.run_tests }}
        run: flutter test test/services/cdn/

      - name: Build APK
        run: |
          flutter build apk --release --split-per-abi \
            --dart-define-from-file=pili_release.json --no-pub
          ls -lh build/app/outputs/flutter-apk/

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: PiliPlus-android
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error

  # 构建成功后发一个 beta 预发布。
  # 关键是 `needs`：iOS 构建挂了就不会有半成品 release —— 前面那些"看起来成功"
  # 的步骤不算证据，只有产物算。
  release:
    name: Publish beta prerelease
    needs: [ios, android]
    if: >-
      ${{
        always() &&
        (github.event_name == 'push' || inputs.make_release) &&
        needs.ios.result == 'success' &&
        needs.android.result == 'success'
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts

      - name: Rename for humans
        run: |
          set -euo pipefail
          mkdir -p dist
          ver=$(grep -m1 '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)
          short=$(git rev-parse --short HEAD)
          stamp=$(date -u +%Y%m%d-%H%M)
          for apk in artifacts/PiliPlus-android/*.apk; do
            abi=$(basename "$apk" .apk | sed 's/^app-//')
            cp "$apk" "dist/PiliPlus_${ver}-beta_${stamp}_${short}_${abi}.apk"
          done
          cp artifacts/PiliPlus-ios-unsigned/PiliPlus.ipa \
             "dist/PiliPlus_${ver}-beta_${stamp}_${short}_ios-unsigned.ipa"
          echo "TAG=beta-${stamp}-${short}" >> "$GITHUB_ENV"
          ls -lh dist

      - name: Publish prerelease
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG }}
          name: ${{ env.TAG }}
          prerelease: true
          draft: false
          generate_release_notes: true
          body: |
            beta 预发布（CI 自动产出）。

            - `*_ios-unsigned.ipa`：**未签名**，请自行签名安装（AltStore / SideStore /
              Sideloadly / TrollStore）。
            - `*_<abi>.apk`：按 ABI 拆分，直接装。
            - 构建自 commit ${{ github.sha }}。
          files: dist/*
