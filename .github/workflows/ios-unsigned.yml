# 只做一件事：在 GitHub 的 macOS runner 上出一个**未签名** iOS IPA，供你自己签。
#
# 为什么走 CI：产出 iOS 包必须有 macOS + Xcode，Windows 做不到。这条流水线用的是
# GitHub 免费额度里的 macOS runner（公开仓库免费；私有仓库按 macOS 倍率扣分钟）。
#
# 前置（都很关键）：
#   1. 本文件必须在**默认分支**（main）上，workflow_dispatch 才会在 Actions 页出现。
#   2. 仓库 Settings → Actions → General 里允许运行工作流。
#
# 跑完在 Actions 页面下载 artifact `PiliPlus-ios-unsigned`，里面是 PiliPlus.ipa。
# 自己签名的路子（服务端不参与）：
#   - AltStore / SideStore / Sideloadly / TrollStore 直接吃这个未签名 IPA；
#   - 免费 Apple ID 的 provisioning 7 天过期，SideStore 可自动续期；
#   - 上游 CI 里特意对 Frameworks 做了 ad-hoc codesign（`codesign --force --sign -`），
#     那一步是给 AltStore 用的，这里保留了。

name: Build iOS (unsigned)

on:
  workflow_dispatch:
    inputs:
      run_tests:
        description: '先跑 CDN 相关单测'
        type: boolean
        default: true
      flutter_version:
        description: 'Flutter 版本（留空 = 3.47.5，与本机一致）'
        type: string
        default: '3.47.5'

jobs:
  build-ios:
    name: Release iOS (unsigned)
    # 与上游 CI 同样的 runner
    runs-on: macos-26
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # build.ps1 用 git rev-list --count HEAD 算 versionCode，需要完整历史
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ inputs.flutter_version }}
          cache: true

      - name: Prepare (版本约束 / 依赖 / patch)
        shell: pwsh
        run: tool/ci_prepare_ios.ps1

      - name: Run CDN unit tests
        if: ${{ inputs.run_tests }}
        run: flutter test test/services/cdn/

      - name: Build IPA
        run: |
          flutter build ios --release --no-codesign \
            --dart-define-from-file=pili_release.json --no-pub
          ln -sf ./build/ios/iphoneos Payload
          # AltStore 需要 frameworks 有签名（ad-hoc 即可）
          find Payload/Runner.app/Frameworks -type d -name "*.framework" \
            -exec codesign --force --sign - --preserve-metadata=identifier,entitlements {} \;
          zip -r9 PiliPlus.ipa Payload/Runner.app
          ls -lh PiliPlus.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v7
        with:
          name: PiliPlus-ios-unsigned
          path: PiliPlus.ipa
          if-no-files-found: error
